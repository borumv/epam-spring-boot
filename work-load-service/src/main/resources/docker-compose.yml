version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
  app:
    image: your-app-image
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/workloaddb
    depends_on:
      - mongodb

volumes:
  mongo-data:
